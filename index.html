        const pyBase = pointer.smoothTiltY * 22;

        for (let i = 0; i < stars.length; i++) {
          const st = stars[i];
          const pFactor = st.layer === 0 ? 0.25 : st.layer === 1 ? 0.62 : 1.05;
          let sx = (st.x - pxBase * pFactor) % state.width;
          let sy = (st.y - pyBase * pFactor) % state.height;
          if (sx < 0) sx += state.width;
          if (sy < 0) sy += state.height;

          const twinkle = 0.55 + 0.45 * Math.sin(state.time * st.twinkleSpeed + st.twinklePhase);
          const alpha = st.baseAlpha * twinkle;

          ctx.fillStyle = `rgba(${st.color},${alpha.toFixed(2)})`;
          ctx.beginPath();
          ctx.arc(sx, sy, st.size, 0, Math.PI * 2);
          ctx.fill();

          if (st.crossSparkle && twinkle > 0.85) {
            const arm = st.size * 2.5;
            ctx.strokeStyle = `rgba(${st.color},${(alpha * 0.52).toFixed(2)})`;
            ctx.lineWidth = 0.65;
            ctx.beginPath();
            ctx.moveTo(sx - arm, sy);
            ctx.lineTo(sx + arm, sy);
            ctx.moveTo(sx, sy - arm);
            ctx.lineTo(sx, sy + arm);
            ctx.stroke();
          }
        }

        // 2. Bintang jatuh
        for (let i = 0; i < shootingStars.length; i++) {
          const ss = shootingStars[i];
          const prog = ss.life / ss.maxLife;
          const alpha = Math.sin(prog * Math.PI) * 0.74;
          const spd = Math.hypot(ss.vx, ss.vy);
          const tx = ss.x - (ss.vx / spd) * ss.len;
          const ty = ss.y - (ss.vy / spd) * ss.len;

          const grad = ctx.createLinearGradient(ss.x, ss.y, tx, ty);
          grad.addColorStop(0, `rgba(224,242,254,${alpha.toFixed(2)})`);
          grad.addColorStop(1, 'rgba(224,242,254,0)');
          ctx.strokeStyle = grad;
          ctx.lineWidth = 1.25;
          ctx.beginPath();
          ctx.moveTo(ss.x, ss.y);
          ctx.lineTo(tx, ty);
          ctx.stroke();
        }

        // 3. Partikel serbuk sari emas yang naik dari bunga
        const visiblePollen = Math.min(pollenParticles.length, Math.round(65 * state.bloomIntensity));
        for (let i = 0; i < visiblePollen; i++) {
          const p = pollenParticles[i];
          const pulse = 0.5 + 0.5 * Math.sin(state.time * 2.8 + p.phase);
          ctx.fillStyle = `rgba(253, 230, 138, ${(p.alpha * pulse).toFixed(2)})`;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
          ctx.fill();
        }

        // 4. Jejak aliran angin karakter ASCII (~ * . -) saat kursor digerakkan
        if (windAsciiTrail.length > 0) {
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.font = '700 10px "JetBrains Mono", monospace';
          for (let i = 0; i < windAsciiTrail.length; i++) {
            const wa = windAsciiTrail[i];
            const alpha = (1 - wa.life / wa.maxLife) * 0.85;
            ctx.fillStyle = `rgba(110, 231, 183, ${alpha.toFixed(2)})`;
            ctx.fillText(wa.char, wa.x, wa.y);
          }
        }

        // 5. Gelombang kejut & percikan pusaran klik
        for (let i = 0; i < shockwaves.length; i++) {
          const sw = shockwaves[i];
          ctx.strokeStyle = `rgba(52,211,153,${sw.alpha.toFixed(2)})`;
          ctx.lineWidth = 1.5;
          ctx.beginPath();
          ctx.arc(sw.x, sw.y, sw.radius, 0, Math.PI * 2);
          ctx.stroke();
        }

        for (let i = 0; i < burstSparks.length; i++) {
          const sp = burstSparks[i];
          const alpha = 1 - sp.life / sp.maxLife;
          ctx.fillStyle = `rgba(${sp.color},${alpha.toFixed(2)})`;
          ctx.beginPath();
          ctx.arc(sp.x, sp.y, sp.size, 0, Math.PI * 2);
          ctx.fill();
        }

        // 6. Render Anatomi Botani Multi-Zona -> 7.000 - 11.000+ Karakter ASCII Mikro
        renderUltraDenseAsciiFlower();

        // 7. Spora kosmik latar depan (paralaks 3D lebih cepat dari bunga)
        for (let i = 0; i < foregroundSpores.length; i++) {
          const sp = foregroundSpores[i];
          let sx = (sp.x - pxBase * 1.85 + Math.sin(state.time * 0.9 + sp.phase) * 14) % state.width;
          let sy = (sp.y - pyBase * 1.85 + Math.cos(state.time * 0.8 + sp.phase) * 14) % state.height;
          if (sx < 0) sx += state.width;
          if (sy < 0) sy += state.height;
          ctx.fillStyle = `rgba(244, 244, 245, ${sp.alpha.toFixed(2)})`;
          ctx.beginPath();
          ctx.arc(sx, sy, sp.size, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      function renderUltraDenseAsciiFlower() {
        const { flowerScale, spacing, fontSize } = getResponsiveMetrics();
        const stages = getBloomStages();

        const cols = Math.max(1, Math.ceil(state.width / spacing));
        const rows = Math.max(1, Math.ceil(state.height / spacing));

        if (offCanvas.width !== cols || offCanvas.height !== rows) {
          offCanvas.width = cols;
          offCanvas.height = rows;
        }

        offCtx.setTransform(1, 0, 0, 1, 0, 0);
        offCtx.clearRect(0, 0, cols, rows);

        // Siklus mekar organik (dipengaruhi slider Intensitas Mekar & pemicu Hembusan)
        const breathAmp = 0.055 * state.bloomIntensity + breeze.bloomSurge * 0.12;
        const bloomFactor = 1.0 + Math.sin(state.time * 1.55) * breathAmp + breeze.bloomSurge * 0.06;

        // Kontraksi benih kosmik saat berpindah spesies (0.00 -> 0.16)
        const contractScale = stages.contract > 0 ? 1 - stages.contract * 0.72 : 1.0;

        // Perspektif 3D halus saat kursor/sentuhan bergerak
        const perspScaleX = flowerScale * contractScale * (1 - Math.abs(pointer.smoothTiltX) * 0.065);
        const perspScaleY = flowerScale * contractScale * (1 - Math.abs(pointer.smoothTiltY) * 0.055);
        const centerX = state.width * 0.5 + pointer.smoothTiltX * 14;
        const centerY = state.height * 0.52 + pointer.smoothTiltY * 12 + stages.contract * 34 * flowerScale;

        offCtx.setTransform(1 / spacing, 0, 0, 1 / spacing, 0, 0);
        offCtx.save();
        offCtx.translate(centerX, centerY);
        offCtx.transform(1, pointer.smoothTiltY * 0.06, pointer.smoothTiltX * 0.08, 1, 0, 0);
        offCtx.scale(perspScaleX, perspScaleY);

        switch (state.flower) {
          case 'rose':
            drawRose(offCtx, state.time, breeze, bloomFactor, stages);
            break;
          case 'sunflower':
            drawSunflower(offCtx, state.time, breeze, bloomFactor, stages);
            break;
          case 'sakura':
            drawSakura(offCtx, state.time, breeze, bloomFactor, stages);
            break;
          case 'lotus':
            drawLotus(offCtx, state.time, breeze, bloomFactor, stages);
            break;
          case 'tulip':
            drawTulip(offCtx, state.time, breeze, bloomFactor, stages);
            break;
          case 'orchid':
            drawOrchid(offCtx, state.time, breeze, bloomFactor, stages);
            break;
          case 'lavender':
            drawLavender(offCtx, state.time, breeze, bloomFactor, stages);
            break;
          case 'dahlia':
            drawDahlia(offCtx, state.time, breeze, bloomFactor, stages);
            break;
          case 'hibiscus':
            drawHibiscus(offCtx, state.time, breeze, bloomFactor, stages);
            break;
          case 'dandelion':
          default:
            drawDandelion(offCtx, state.time, breeze, bloomFactor, stages);
            break;
        }

        offCtx.restore();

        const padX = 250 * flowerScale;
        const padY = 260 * flowerScale;
        const minCol = Math.max(0, Math.floor((centerX - padX) / spacing));
        const maxCol = Math.min(cols - 1, Math.ceil((centerX + padX) / spacing));
        const minRow = Math.max(0, Math.floor((centerY - padY) / spacing));
        const maxRow = Math.min(rows - 1, Math.ceil((centerY + padY) / spacing));

        const scanW = maxCol - minCol + 1;
        const scanH = maxRow - minRow + 1;
        if (scanW <= 0 || scanH <= 0) return;

        const imgData = offCtx.getImageData(minCol, minRow, scanW, scanH).data;
        const activePalette = PALETTES[state.palette] || PALETTES.alami;
        const gustRadius = 115;

        // Fase gelombang cahaya bioluminesensi: selama transisi mekar, merambat dari pangkal batang (0) -> kelopak (1)
        const bioWavePhase = stages.bioSweep >= 0 ? stages.bioSweep : (state.time * 0.55) % 1;

        for (const arr of colorBuckets.values()) {
          arr.length = 0;
        }

        let totalChars = 0;

        for (let r = 0; r < scanH; r++) {
          const row = minRow + r;
          const baseWy = row * spacing + spacing * 0.5;
          const rowOffset = r * scanW * 4;

          for (let c = 0; c < scanW; c++) {
            const idx = rowOffset + c * 4;
            const alpha = imgData[idx + 3];
            if (alpha < 35) continue;

            totalChars++;
            const col = minCol + c;
            const baseWx = col * spacing + spacing * 0.5;

            const lum = (imgData[idx] / 255) * (alpha / 255);
            const partId = imgData[idx + 1];
            const radialPos = imgData[idx + 2] / 255;

            // Hitung denyut cahaya bioluminesensi yang merambat sepanjang radialPos
            const waveDist = Math.abs(((radialPos - bioWavePhase + 1.5) % 1) - 0.5);
            const waveWidth = stages.active ? 0.22 : 0.14;
            const waveAmp = stages.active
              ? 0.34 * state.bloomIntensity
              : 0.18 * state.bloomIntensity + breeze.bloomSurge * 0.25;
            const bioPulse = waveDist < waveWidth ? (1 - waveDist / waveWidth) * waveAmp : 0;

            const disp = displacedCells.get(`${col},${row}`);
            let drawX = disp ? baseWx + disp.dx : baseWx;
            let drawY = disp ? baseWy + disp.dy : baseWy;

            // Getaran kelopak lokal saat kursor menyentuh bunga
            const dxPtr = drawX - pointer.x;
            const dyPtr = drawY - pointer.y;
            const distPtr = Math.hypot(dxPtr, dyPtr);
            let flutterBoost = 0;

            if (pointer.active && distPtr < gustRadius && distPtr > 0.5) {
              const normDist = 1 - distPtr / gustRadius;
              const wave = Math.sin(distPtr * 0.16 - state.time * 10.5) * 4.2 * normDist;
              drawX += (dxPtr / distPtr) * wave + pointer.vx * 0.012 * normDist;
              drawY += (dyPtr / distPtr) * wave + pointer.vy * 0.012 * normDist;
              flutterBoost = normDist;
            }

            const effLum = Math.min(
              1,
              lum + bioPulse + stages.contract * 0.32 + flutterBoost * 0.24 + (disp ? disp.heat * 0.35 : 0)
            );

            const ch = pickCharacter(effLum, partId, col, row);

            let colorStr;
            if ((disp && disp.heat > 0.35) || stages.contract > 0.55 || (stages.active && bioPulse > 0.26)) {
              colorStr = '#fef9c3';
            } else if (flutterBoost > 0.45) {
              colorStr = '#ecfdf5';
            } else {
              colorStr = activePalette.sample(effLum, radialPos, partId, state.time, state.flower);
            }

            let bucket = colorBuckets.get(colorStr);
            if (!bucket) {
              bucket = [];
              colorBuckets.set(colorStr, bucket);
            }
            bucket.push(ch, drawX, drawY);
          }
        }

        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.font = `700 ${fontSize.toFixed(1)}px "JetBrains Mono", monospace`;

        for (const [colorStr, items] of colorBuckets.entries()) {
          if (items.length === 0) continue;
          ctx.fillStyle = colorStr;
          for (let i = 0; i < items.length; i += 3) {
            ctx.fillText(items[i], items[i + 1], items[i + 2]);
          }
        }

        if (Math.abs(totalChars - state.lastRenderedChars) > 45) {
          state.lastRenderedChars = totalChars;
          charCountInfo.textContent = `${totalChars.toLocaleString('id-ID')} karakter aktif`;
        }
      }

      // ============================================================================
      // LOOP ANIMASI UTAMA
      // ============================================================================
      function animate(now) {
        const dt = (now - state.lastFrameTime) / 1000;
        state.lastFrameTime = now;

        updateSimulation(dt);
        render();

        requestAnimationFrame(animate);
      }

      // ============================================================================
      // EVENT HANDLER & PANEL KONTROL TERPISAH
      // ============================================================================
      function handleResize() {
        state.width = window.innerWidth;
        state.height = window.innerHeight;
        state.dpr = Math.min(window.devicePixelRatio || 1, 2);

        canvas.width = Math.floor(state.width * state.dpr);
        canvas.height = Math.floor(state.height * state.dpr);
        ctx.setTransform(state.dpr, 0, 0, state.dpr, 0, 0);

        initGalaxy();
      }
      window.addEventListener('resize', handleResize);

      const WIND_TRAIL_CHARS = ['~', '*', '.', '-', '✿', '·'];

      function recordPointerMove(cx, cy) {
        const now = performance.now() / 1000;
        const dx = cx - pointer.prevX;
        const dy = cy - pointer.prevY;

        pointer.vx = dx * 24;
        pointer.vy = dy * 24;
        pointer.prevX = cx;
        pointer.prevY = cy;
        pointer.x = cx;
        pointer.y = cy;
        pointer.normX = (cx / Math.max(1, state.width)) * 2 - 1;
        pointer.normY = (cy / Math.max(1, state.height)) * 2 - 1;
        pointer.active = true;
        pointer.lastMoveTime = now;

        breeze.gustImpulse = Math.max(
          -0.88,
          Math.min(0.88, breeze.gustImpulse + (dx / Math.max(200, state.width)) * 3.0)
        );

        // Jejak aliran angin karakter ASCII (~ * . -)
        if (Math.hypot(dx, dy) > 2 && windAsciiTrail.length < 75) {
          windAsciiTrail.push({
            x: cx + (Math.random() - 0.5) * 14,
            y: cy + (Math.random() - 0.5) * 14,
            vx: dx * 0.25 + (Math.random() - 0.5) * 24,
            vy: dy * 0.25 - 12 - Math.random() * 16,
            char: WIND_TRAIL_CHARS[Math.floor(Math.random() * WIND_TRAIL_CHARS.length)],
            life: 0,
            maxLife: 0.48 + Math.random() * 0.35,
          });
        }
      }

      canvas.addEventListener('pointermove', (e) => {
        recordPointerMove(e.clientX, e.clientY);
      });

      canvas.addEventListener('pointerdown', (e) => {
        recordPointerMove(e.clientX, e.clientY);
        triggerCosmicVortex(e.clientX, e.clientY, true);
      });

      canvas.addEventListener(
        'touchmove',
        (e) => {
          if (e.touches.length > 0) {
            const t = e.touches[0];
            recordPointerMove(t.clientX, t.clientY);
          }
        },
        { passive: true }
      );

      // Buka/Tutup Laci Panel Kontrol Terpisah
      function setDrawerState(open) {
        state.drawerOpen = open;
        toggleDrawerBtn.setAttribute('aria-expanded', String(open));
        if (open) {
          controlDrawer.classList.remove('opacity-0', 'translate-x-6', 'scale-95', 'pointer-events-none');
          controlDrawer.classList.add('opacity-100', 'translate-x-0', 'scale-100', 'pointer-events-auto');
          gearIcon.classList.add('rotate-90');
        } else {
          controlDrawer.classList.add('opacity-0', 'translate-x-6', 'scale-95', 'pointer-events-none');
          controlDrawer.classList.remove('opacity-100', 'translate-x-0', 'scale-100', 'pointer-events-auto');
          gearIcon.classList.remove('rotate-90');
        }
      }

      toggleDrawerBtn.addEventListener('click', () => setDrawerState(!state.drawerOpen));
      closeDrawerBtn.addEventListener('click', () => setDrawerState(false));

      // Tombol Pemicu "🌸 Mekar Ulang" (mengulang animasi mekar botani multi-tahap)
      replayBloomBtn.addEventListener('click', () => {
        startBloomTransition(state.flower, false);
      });

      // Tombol Pemicu "✨ Hembusan"
      gustBloomBtn.addEventListener('click', () => {
        triggerCosmicVortex(state.width * 0.5, state.height * 0.48, true);
      });

      // Mode Bersih
      let toastTimer = null;

      function setCleanMode(enabled) {
        state.cleanMode = enabled;
        if (enabled) {
          setDrawerState(false);
          floatingTriggerWrap.classList.add('opacity-0', 'pointer-events-none', '-translate-y-3');
          cleanHintToast.classList.remove('opacity-0');
          if (toastTimer) clearTimeout(toastTimer);
          toastTimer = setTimeout(() => {
            cleanHintToast.classList.add('opacity-0');
          }, 2600);
        } else {
          floatingTriggerWrap.classList.remove('opacity-0', 'pointer-events-none', '-translate-y-3');
          cleanHintToast.classList.add('opacity-0');
        }
      }

      cleanModeBtn.addEventListener('click', () => {
        setCleanMode(true);
      });

      canvas.addEventListener('dblclick', () => {
        if (state.cleanMode) setCleanMode(false);
      });

      let lastTapTime = 0;
      let lastTapX = 0;
      let lastTapY = 0;

      canvas.addEventListener(
        'touchend',
        (e) => {
          if (!state.cleanMode) return;
          const now = performance.now();
          const touch = e.changedTouches[0];
          if (!touch) return;
          const dist = Math.hypot(touch.clientX - lastTapX, touch.clientY - lastTapY);
          if (now - lastTapTime < 340 && dist < 50) {
            setCleanMode(false);
            lastTapTime = 0;
          } else {
            lastTapTime = now;
            lastTapX = touch.clientX;
            lastTapY = touch.clientY;
          }
        },
        { passive: true }
      );

      window.addEventListener('keydown', (e) => {
        if (document.activeElement === customCharsInput) return;
        if (e.key === 'h' || e.key === 'H' || (e.key === 'Escape' && state.cleanMode)) {
          setCleanMode(!state.cleanMode);
        }
      });

      // Pemilih 10 Jenis Bunga
      function refreshFlowerButtons(displayKey = state.flower) {
        flowerBtns.forEach((btn) => {
          const active = btn.dataset.flower === displayKey;
          if (active) {
            btn.className =
              'flower-btn flex items-center gap-2 px-2.5 py-2 rounded-2xl border border-emerald-400/70 bg-gradient-to-r from-emerald-500/25 to-pink-500/20 text-white shadow-[0_0_16px_rgba(52,211,153,0.22)] text-[11px] font-medium transition-all duration-200 cursor-pointer';
          } else {
            btn.className =
              'flower-btn flex items-center gap-2 px-2.5 py-2 rounded-2xl border border-white/10 bg-white/[0.04] hover:bg-white/[0.09] text-slate-300 text-[11px] font-medium transition-all duration-200 cursor-pointer';
          }
        });
        activeFlowerBadge.textContent = FLOWER_NAMES[displayKey] || 'Mawar';
      }

      flowerBtns.forEach((btn) => {
        btn.addEventListener('click', () => {
          const chosen = btn.dataset.flower;
          refreshFlowerButtons(chosen);
          // Jika berganti ke bunga berbeda, jalankan kontraksi benih -> tumbuh batang -> mekar penuh;
          // jika menekan bunga yang sama, ulangi animasi mekar dari kuncup
          startBloomTransition(chosen, chosen !== state.flower);
        });
      });

      paletteSelect.addEventListener('change', (e) => {
        state.palette = e.target.value;
        const pal = PALETTES[state.palette];
        if (pal && pal.dots) {
          paletteDots.innerHTML = pal.dots
            .map((hex) => `<span class="w-2 h-2 rounded-full" style="background:${hex}"></span>`)
            .join('');
        }
      });

      charsetSelect.addEventListener('change', (e) => {
        state.charsetMode = e.target.value;
        if (state.charsetMode === 'custom') {
          customCharsInput.classList.remove('hidden');
          customCharsInput.focus();
        } else {
          customCharsInput.classList.add('hidden');
        }
      });

      customCharsInput.addEventListener('input', (e) => {
        state.customChars = e.target.value;
      });

      densitySlider.addEventListener('input', (e) => {
        state.densityLevel = parseInt(e.target.value, 10);
        const preset = DENSITY_LEVELS[state.densityLevel] || DENSITY_LEVELS[3];
        densityLabel.textContent = preset.label;
      });

      windSlider.addEventListener('input', (e) => {
        state.windSpeed = parseFloat(e.target.value);
        windLabel.textContent = `${state.windSpeed.toFixed(1)}x`;
      });

      bloomIntensitySlider.addEventListener('input', (e) => {
        state.bloomIntensity = parseFloat(e.target.value);
        bloomIntensityLabel.textContent = `${state.bloomIntensity.toFixed(1)}x`;
      });

      window.onload = function () {
        refreshFlowerButtons(state.flower);
        handleResize();
        // Jalankan animasi mekar pembuka saat halaman pertama kali dibuka
        startBloomTransition(state.flower, false);
        requestAnimationFrame(animate);
      };
    })();
  </script>
</body>
</html>
